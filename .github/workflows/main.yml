name: Patch and Build Discover

on:
  pull_request:
  workflow_dispatch: 
  schedule:
    - cron: 0 * * * *

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Prepare Backend
        run: |
          git clone --depth 1 --branch v6.7.4 https://invent.kde.org/plasma/discover.git
          git clone --depth 1 https://github.com/Containerpak/cpak.git
          cd discover
          python3 ../apply_patch.py
          cp -r ../cpak/contrib/discover/CpakBackend libdiscover/backends/CpakBackend

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt-get build-dep -y plasma-discover

      - name: Configure CMake
        run: |
          sed -i 's/set(KF6_MIN_VERSION ".*")/set(KF6_MIN_VERSION "6.24.0")/' discover/CMakeLists.txt
          sed -i 's/set(QT_MIN_VERSION ".*")/set(QT_MIN_VERSION "6.10.2")/' discover/CMakeLists.txt
          cmake -S discover -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CpakBackend=ON \
            -DBUILD_FlatpakBackend=OFF \
            -DBUILD_SnapBackend=OFF \
            -DBUILD_PackageKitBackend=OFF \
            -DBUILD_FwupdBackend=OFF \
            -DBUILD_RpmOstreeBackend=OFF \
            -DBUILD_SteamOSBackend=OFF \
            -DBUILD_DummyBackend=OFF

      - name: Build project
        run: cmake --build build --target cpak-backend --parallel $(nproc)

      - name: Copy project
        run: |
          DESTDIR=$(pwd)/release_pkg cmake --install build/libdiscover/backends/CpakBackend
          cp install.sh uninstall.sh release_pkg/
          chmod +x release_pkg/install.sh release_pkg/uninstall.sh
          cd release_pkg
          zip -r ../cpak-backend-x86_64.zip .
          cd ..
          rm -rf release_pkg

      - name: Release Backend
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./cpak-backend-x86_64.zip
          tag: prebuilt
          overwrite: true
          body: "Cpak Backend for KDE SOFTWARE CENTER"
          file_glob: true
