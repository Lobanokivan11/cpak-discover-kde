name: Patch and Build Discover

on:
  pull_request:
  workflow_dispatch: 
  schedule:
    - cron: 0 * * * *

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Prepare Backend
        run: |
          git clone https://invent.kde.org/plasma/discover.git
          git clone https://github.com/Containerpak/cpak.git
          cd discover
          python3 ../apply_patch.py
          cp -r ../cpak/contrib/discover/CpakBackend libdiscover/backends/CpakBackend

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --install-recommends \
            build-essential cmake ninja-build zip git \
            extra-cmake-modules pkg-config \
            qt6-base-dev qt6-declarative-dev \
            libkf6archive-dev libkf6attica-dev libkf6auth-dev \
            libkf6cmutils-dev libkf6codecs-dev libkf6config-dev \
            libkf6configwidgets-dev libkf6coreaddons-dev libkf6crash-dev \
            libkf6dbusaddons-dev libkf6i18n-dev libkf6idletime-dev \
            libkf6io-dev libkf6itemmodels-dev libkf6kio-dev \
            libkf6newstuff-dev libkf6notifications-dev libkf6purpose-dev \
            libkf6service-dev libkf6statusnotifieritem-dev \
            libkf6userfeedback-dev libkf6widgetsaddons-dev \
            libkf6windowsystem-dev libkf6xmlgui-dev \
            libappstreamqt-dev kirigami-addons-dev

      - name: Configure CMake
        run: |
          cmake -S discover -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CpakBackend=ON \
            -DBUILD_FlatpakBackend=OFF \
            -DBUILD_SnapBackend=OFF \
            -DBUILD_PackageKitBackend=OFF \
            -DBUILD_FwupdBackend=OFF \
            -DBUILD_RpmOstreeBackend=OFF \
            -DBUILD_SteamOSBackend=OFF \
            -DBUILD_DummyBackend=OFF

      - name: Build project
        run: cmake --build build --target cpak-backend --parallel $(nproc)

      - name: Copy project
        run: |
          DESTDIR=$(pwd)/release_pkg cmake --install build/libdiscover/backends/CpakBackend
          cd release_pkg
          zip -r ../cpak-backend-x86_64.zip .
          cd ..
          rm -rf release_pkg

      - name: Release Backend
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./cpak-backend-x86_64.zip
          tag: prebuilt
          overwrite: true
          body: "Cpak Backend for KDE SOFTWARE CENTER"
          file_glob: true
